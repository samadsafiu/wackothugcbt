<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    padding: 32px 20px;
    overflow-x: hidden;
    background: #202b49 url("./BG.png") center center / cover no-repeat;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  h2 {
    margin: 0 0 24px;
    font-size: clamp(1.5rem, 3vw, 2.25rem);
  }

  .subjects {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }

  .subjects button {
    width: 100%;
    min-width: 0;
    min-height: 100px;
    padding: 16px;
    border: 2px solid #6478ff;
    border-radius: 15px;
    background: #202b49;
    color: white;
    font-size: clamp(1rem, 1.5vw, 1.25rem);
    cursor: pointer;
    overflow-wrap: break-word;
    -webkit-tap-highlight-color: transparent;
  }

  .subjects button:hover {
    transform: none;
  }

  @media screen and (max-width: 600px) {
    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      background-position: center top;
      background-size: cover;
      background-attachment: scroll;
    }

    h2 {
      font-size: clamp(20px, 6vw, 28px);
    }

    .subjects {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 420px;
    }

    .subjects button {
      min-height: 72px;
      padding: 12px 8px;
      font-size: clamp(14px, 4vw, 18px);
    }
  }
</style>
