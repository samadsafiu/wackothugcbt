<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT WEBSITE</title>
<link rel="stylesheet" href="./style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

#logback {
  min-height: 100vh;
  height: auto !important;
  padding: 40px 16px;
  background-size: cover;
  background-position: center;
}

#logbrb {
  padding-top: 60px !important;
}

#logdiv {
  width: 400px;
  max-width: 100%;
  height: auto !important;
  margin: 0 auto !important;
  padding: 20px;
  background-color: white;
}

#logh1 {
  justify-content: center;
  padding-top: 10px !important;
  text-align: center;
}

#logp {
  padding-top: 15px !important;
  text-align: center;
}

#logdiv > div {
  padding: 8px 12px !important;
  margin-bottom: 12px;
}

#name,
#exam {
  width: calc(100% - 65px);
  max-width: 100%;
  margin-left: 8px !important;
  padding-left: 10px !important;
}

#logimg {
  width: 30px;
  height: 30px;
  object-fit: contain;
}

#logdiv2 {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 20px !important;
}

#logdiv2 a {
  margin-left: 0;
}

#logdiv2 button {
  width: 100px !important;
  margin: 0 !important;
  padding: 8px;
  font-size: 16px !important;
}

@media (max-width: 480px) {
  #logback {
    padding: 20px 12px;
  }

  #logbrb {
    padding-top: 20px !important;
  }

  #logdiv {
    padding: 16px;
  }

  #logh1 {
    font-size: 1.5rem;
  }

  #logp {
    font-size: 16px !important;
  }

  #logdiv > div {
    padding-left: 8px !important;
  }
}
</style>
</head>

<body>
<div id="logback" style="background-image: url(./BG.png); height: 100vh;">
  <div id="logbrb" style="padding-top: 100px;">
    <div id="logdiv" style="background-color: white; height: 450px; width: 400px; margin-left: 650px;">
      <h1 id="logh1" style="display: flex; justify-content: center; padding-top: 20px;">TO START</h1>

      <p id="logp" style="font-size: 20px; padding-top: 40px;">ENTER YOUR EXAMINATION DETAILS</p>

      <div style=" padding-left: 20px;">
        <p>ENTER YOUR EXAMINATION NAME</p>
        NAME:<input style="height: 30px; border: none; padding-left: 20px; margin-left: 20px;" placeholder="FULL NAME" id="name">
      </div>

      <div style=" padding-left: 20px;">
        <p>EXAMINATION NUMBER</p>
        <img id="logimg" src="./ICON.png" style="float: left;">
        <input style="height: 30px; border: none; padding-left: 20px; margin-left: 20px;" placeholder="EXAMINATION NO" id="exam">
        <p id="error" style="color: red;"></p>
      </div>

      <div id="logdiv2" style="margin-top: 30px;">
        <a href="./cancel.html"><button style="width: 80px; margin-left: 20px; background-color: red; font-size: 20px;">EXIT</button></a>
        <button style="width: 80px; margin-left: 60px; background-color: green; font-size: 20px;" onclick="start()">START</button>
      </div>
      <p style="margin-top: 30px; color: gray; font-size: 12px; text-align: right;">
        © 2026 (WACKOTHUG)
      </p>
    </div>
  </div>
</div>

<script src="./front.js"></script>
</body>
</html>
